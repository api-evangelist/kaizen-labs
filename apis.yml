aid: kaizen-labs
name: Kaizen Labs
description: >-
  Kaizen Labs is a New York City based govtech company founded in 2022 that
  builds modern, AI-native software for America's essential public services. Its
  modular SaaS platform helps local, state, and federal agencies replace legacy
  systems and deliver resident-facing digital services across recreation and
  facility reservations, permitting and licensing, DMV and licensing workflows,
  parking management, tolls, public transportation fare collection, e-billing
  and tax payments, citations, and judicial court services. The platform is a
  single, hyper-configurable framework reported to reach more than 40 million
  residents across 50+ agencies in 17 states. Kaizen Labs is backed by NEA,
  Andreessen Horowitz (a16z), Accel, 776, and Carpenter Capital. This profile
  was surfaced as an a16z portfolio company and enriched by the API Evangelist
  pipeline; Kaizen Labs delivers bespoke integrations to public-sector customers
  and does not publish a public developer API program at this time.
